name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.9.30"
      - run: uv sync --locked
      - run: uv run --locked ruff check src tests scripts experiments parse_document.py
      - run: uv run --locked ruff format --check src tests scripts experiments parse_document.py
      - run: uv run --locked pytest
