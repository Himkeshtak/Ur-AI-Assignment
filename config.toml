# TATR runs locally on CPU; recognition and Japanese review use explicit APIs.
# Provider credentials are read at runtime, never stored in this config or outputs.
env_file = ".env"
[render]
dpi = 300
max_pages = 30
max_file_mb = 50
max_pixels = 24000000
max_cells_per_table = 500
table_padding = 12

[detection]
model_id = "microsoft/table-transformer-detection"
revision = "2357cbe2b5a5d1c03e54f32764f06058933b65ab"
local_dir = "models/tatr/detection"
device = "cpu"
threshold = 0.7

[structure]
model_id = "microsoft/table-transformer-structure-recognition-v1.1-all"
revision = "7587a7ef111d9dcbf8ac695f1376ab7014340a0c"
local_dir = "models/tatr/structure"
device = "cpu"
threshold = 0.6

[ocr]
backend = "vlmrun"
model_id = "paddlepaddle/paddleocr-vl-1.6"
api_key_env = "VLMRUN_API_KEY"
max_cell_characters = 2000
max_pixels = 1605632
timeout_seconds = 120
min_interval_seconds = 1.0
max_requests = 2000
# One retry per table, shared by failed/empty clean-cell requests.
max_retries_per_table = 1

[japanese]
backend = "groq"
model_id = "qwen/qwen3.8-27b"
api_key_env = "GROQ_API_KEY"
context_tokens = 4096
max_new_tokens = 512
format_retries = 1
timeout_seconds = 120
min_interval_seconds = 2.1
max_requests = 100

[financial]
mode = "invoice" # "table" explicitly permits inapplicable invoice checks.
tax_mode = "unknown" # Set "exclusive" or "inclusive" for a known invoice profile.
money_scale = 0 # Whole-yen line amounts/totals; unit prices may be fractional.
# Optional explicit policies, e.g.:
# rounding = "ROUND_HALF_UP"
# tax_rate = "0.10"
