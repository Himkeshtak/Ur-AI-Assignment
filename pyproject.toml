[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "jp-pdf-parser"
version = "0.1.0"
description = "Japanese PDF tables with explicit cell geometry and auditable validation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic>=2.11,<3",
  "pillow>=11.3,<12",
  "pypdfium2>=5.5,<6",
]

[project.optional-dependencies]
tatr = [
  "torch>=2.8,<2.9",
  "torchvision>=0.23,<0.24",
  "transformers==4.57.6",
  "timm>=1.0,<2",
  "huggingface-hub>=0.36,<1",
]
models = [
  "jp-pdf-parser[tatr]",
  "paddleocr[doc-parser]==3.7.0",
  "paddlepaddle==3.3.1",
  "sentencepiece>=0.2,<0.3",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17"]

[project.scripts]
jp-pdf-parser = "jp_pdf_parser.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jp_pdf_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
required-version = ">=0.9.30"
